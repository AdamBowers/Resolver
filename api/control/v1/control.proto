syntax = "proto3";

package dnsresolver.control.v1;

option go_package = "://github.com";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Unix Domain Socket Control Plane Messages (Content-Type: application/x-protobuf)
// ============================================================================

// ReloadState tracks the singleton lifecycle of an asynchronous policy reload inside CoreDNS.
enum ReloadState {
  // Default unset state.
  RELOAD_STATE_UNSPECIFIED = 0;

  // Initial startup policy load completed; no manual reload has been triggered yet.
  RELOAD_STATE_IDLE = 1;

  // A duty-paced background policy reload is currently streaming and building trees.
  RELOAD_STATE_RUNNING = 2;

  // The most recent policy reload completed, verified signatures, and swapped the active snapshot.
  RELOAD_STATE_SUCCEEDED = 3;

  // The most recent policy reload failed validation or I/O; the previous valid snapshot remains active.
  RELOAD_STATE_FAILED = 4;
}

// GetPolicyResponse is returned by `GET /policy` (HTTP 200 OK) to report the currently active
// policy snapshot and schema compatibility window.
message GetPolicyResponse {
  // Version of the Unix socket control protocol spoken by this CoreDNS instance (currently 1).
  uint32 control_protocol_version = 1;

  // Lowest PolicyHeader.schema_version this CoreDNS instance will accept.
  uint32 min_policy_schema = 2;

  // Highest PolicyHeader.schema_version this CoreDNS instance will accept.
  uint32 max_policy_schema = 3;

  // Active policy rule revision number (0 if a 0-byte pass-through bundle is active).
  uint64 policy_revision = 4;

  // Timestamp when the active policy_revision was originally generated by the Controller.
  google.protobuf.Timestamp policy_created_at = 5;

  // Active monotonic bundle signing sequence number.
  uint64 bundle_sequence = 6;

  // Timestamp when the active bundle envelope was signed.
  google.protobuf.Timestamp bundle_signed_at = 7;

  // Number of active domain blocklist rules loaded in the DomainTree.
  uint64 blocked_domain_rules = 8;

  // Number of active IPv4/IPv6 CIDR prefixes loaded in the IPRadixTree.
  uint64 blocked_cidr_rules = 9;

  // Hex-encoded SHA-256 digest of the entire policy.pb file on disk (empty for 0-byte pass-through).
  string bundle_sha256 = 10;

  // Timestamp when CoreDNS atomically activated this PolicySnapshot.
  google.protobuf.Timestamp loaded_at = 11;
}

// ReloadPolicyRequest is sent as the body of `POST /policy/reload` by the host Node-Agent.
message ReloadPolicyRequest {
  // Control protocol version of the calling Node-Agent for compatibility auditing.
  uint32 client_control_version = 1;

  // Optional expected policy_revision written to disk (logged for audit correlation).
  uint64 expected_policy_revision = 2;

  // Optional expected bundle_sequence written to disk (logged for audit correlation).
  uint64 expected_bundle_sequence = 3;

  // If true, CoreDNS reloads trusted-keyring.pb from disk before verifying the new policy bundle.
  bool reload_keyring = 4;
}

// ReloadPolicyResponse is returned by `POST /policy/reload`:
//   - HTTP 202 Accepted when a new asynchronous reload job has been started.
//   - HTTP 409 Conflict when a reload is already RELOAD_STATE_RUNNING.
message ReloadPolicyResponse {
  // Current reload state (always RELOAD_STATE_RUNNING on both 202 Accepted and 409 Conflict).
  ReloadState state = 1;

  // Version of the Unix socket control protocol spoken by this CoreDNS instance.
  uint32 control_protocol_version = 2;

  // Lowest PolicyHeader.schema_version supported by this CoreDNS instance.
  uint32 min_policy_schema = 3;

  // Highest PolicyHeader.schema_version supported by this CoreDNS instance.
  uint32 max_policy_schema = 4;

  // Timestamp when the active reload pass began executing.
  google.protobuf.Timestamp started_at = 5;
}

// ReloadStatusResponse is returned by `GET /policy/reload` (HTTP 200 OK) to report
// the progress or final outcome of the latest policy reload.
message ReloadStatusResponse {
  // Current lifecycle state of the latest reload (IDLE, RUNNING, SUCCEEDED, or FAILED).
  ReloadState state = 1;

  // True if the completed reload activated a new snapshot (false if identical SHA-256 was already active).
  bool changed = 2;

  // Human-readable failure reason when state == RELOAD_STATE_FAILED (empty otherwise).
  string error_message = 3;

  // Policy revision loaded by this reload (populated when state == RELOAD_STATE_SUCCEEDED).
  uint64 policy_revision = 4;

  // Creation timestamp of the loaded policy revision.
  google.protobuf.Timestamp policy_created_at = 5;

  // Bundle signing sequence loaded by this reload.
  uint64 bundle_sequence = 6;

  // Signing timestamp of the loaded bundle envelope.
  google.protobuf.Timestamp bundle_signed_at = 7;

  // Number of domain blocklist rules loaded by this reload.
  uint64 blocked_domain_rules = 8;

  // Number of IPv4/IPv6 CIDR blocklist rules loaded by this reload.
  uint64 blocked_cidr_rules = 9;

  // Hex-encoded SHA-256 digest of the loaded policy.pb file.
  string bundle_sha256 = 10;

  // Timestamp when this reload pass started.
  google.protobuf.Timestamp started_at = 11;

  // Timestamp when this reload pass finished (unset while state == RELOAD_STATE_RUNNING).
  google.protobuf.Timestamp finished_at = 12;
}

// HealthResponse is returned by `GET /healthz` (HTTP 200 OK) for lightweight container health probes.
message HealthResponse {
  // True when CoreDNS has completed its initial policy load and is actively serving DNS queries.
  bool healthy = 1;

  // Version of the Unix socket control protocol spoken by this CoreDNS instance.
  uint32 control_protocol_version = 2;

  // Current background reload state (IDLE, RUNNING, SUCCEEDED, or FAILED).
  ReloadState reload_state = 3;

  // Error message from the most recent failed reload, if any (cleared on the next successful reload).
  string last_reload_error = 4;
}
